[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "progress-bot"
version = "0.1.0"
description = "OSGuild Progress Hub bot: validates contributor reports and writes weekly summaries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Open-Source Guild" }]
requires-python = ">=3.13"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
llm = ["openai>=2.0,<4"]

[project.urls]
Homepage = "https://github.com/sadeeqrabiu/progress-hub"

[project.scripts]
progress-bot = "progress_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0",
    "openai>=2.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/progress_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["RUF001", "RUF012"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
