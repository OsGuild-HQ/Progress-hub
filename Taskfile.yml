version: "3"

tasks:
  sync:
    desc: Install the bot and dev tools into .venv
    cmds:
      - uv sync

  validate:
    desc: Check every contributor file
    cmds:
      - uv run progress-bot validate {{.CLI_ARGS}}

  summary:
    desc: Write last week's Guild summary (pass flags after --)
    cmds:
      - uv run progress-bot summarize {{.CLI_ARGS}}

  fmt:
    desc: Format and auto-fix lint issues
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  lint:
    desc: Lint, format check, and type check
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pyright

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest -q {{.CLI_ARGS}}

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: test
