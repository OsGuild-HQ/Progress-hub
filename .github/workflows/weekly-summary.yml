name: Weekly summary

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC, for the week that just ended
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week, e.g. 2026-W48 (default: last week)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency: weekly-summary

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ".[llm]"
      - name: Write the summary and open a PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these to add AI narratives. Reports are sent to this endpoint.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          WEEK_INPUT: ${{ inputs.week }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          args=()
          if [ -n "$WEEK_INPUT" ]; then args+=(--week "$WEEK_INPUT"); fi
          if [ -n "$OPENAI_BASE_URL" ]; then args+=(--llm); fi
          report=$(progress-bot summarize "${args[@]}")
          week=$(basename "$report" .md)
          branch="bot/weekly-$week"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$report"
          if git diff --cached --quiet; then
            echo "Nothing new for $week."
            exit 0
          fi
          git commit -m "Weekly summary $week"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "Weekly summary $week" \
              --body "Generated by progress-bot. Mentors: check the **Needs attention** list."
          fi
